<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코어 테스트</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  .pass { color: #15803d; } .fail { color: #b91c1c; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>코어 로직 테스트</h1>
<ul id="out"></ul>
<p id="sum"></p>
<script type="module">
  import { tests } from './core.test.js';
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const { name, fn } of tests) {
    const li = document.createElement('li');
    try { fn(); li.className = 'pass'; li.textContent = '✓ ' + name; pass++; }
    catch (e) { li.className = 'fail'; li.textContent = '✗ ' + name + '\n  ' + e.message; fail++; }
    out.appendChild(li);
  }
  document.getElementById('sum').textContent = `통과 ${pass} / 실패 ${fail}`;
  window.__testResult = { pass, fail };
</script>
</body>
</html>
